name: haul
description: >-
  Offline downloads of HLS, DASH and plain-file video for Flutter apps:
  reads the source, picks its tracks, fetches every piece through
  background_downloader and leaves a local HLS package or one file. Each app
  plugs in where links come from, where files go and how ffmpeg runs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  background_downloader: ^9.6.4
  collection: ^1.19.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  meta: ^1.16.0
  mime: ^2.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  xml: ^7.0.0

dev_dependencies:
  build_runner: ^2.10.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
